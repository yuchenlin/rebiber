name: Star history

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/star_history.py
      - .github/workflows/star-history.yml

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Render star-history SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python scripts/star_history.py --output docs/star-history.svg

      - name: Commit chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          if git diff --staged --quiet; then
            echo "Star history unchanged"
          else
            git commit -m "chore: refresh in-repo star history chart"
            git push
          fi
