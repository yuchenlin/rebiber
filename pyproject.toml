[project]
name = "rebiber"
authors = [
    { name = "Bill Yuchen Lin", email = "i@yuchenlin.xyz" },
    { name = "Yang Qiao" },
]
description = "A tool for normalizing bibtex with official info."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["bibtexparser", "tqdm", "requests"]
version = "1.3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yuchenlin/rebiber"

[project.scripts]
rebiber = "rebiber.normalize:main"
bib2json = "rebiber.bib2json:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebiber"]

[tool.hatch.build.targets.sdist]
include = [
    "/rebiber",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
